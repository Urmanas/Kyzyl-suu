{% extends 'core/base.html' %}

{% block title%}Delete tour{% endblock %}

{% block content %}
<section class="max-w-xl mx-auto py-16 text-center">
    <h1 class="text-2xl font-bold mb-4">
        Delete "{{ tour.title }}"?
    </h1>

    <form method="post">
        {% csrf_token %}
        <button class="bg-red-600 text-white px-6 py-2 rounded hover:bg-red-700">
            Yes, delete
        </button>
    </form>

    <a href="{% url 'tours:tour_detail' tour.id %}" class="block mt-4 text-gray-600">
        Cancel
    </a>
</section>
{% endblock %}
