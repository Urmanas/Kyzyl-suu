{% extends "core/base.html" %}

{% block content %}
<section class="max-w-md mx-auto py-16">
    <h1 class="text-2xl font-bold mb-6">Sign Up</h1>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="w-full bg-blue-600 text-white py-2 rounded">
            Create Account
        </button>
    </form>
</section>
{% endblock %}
