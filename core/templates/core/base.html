<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>{% block title %}Kyzyl Suu Trails{% endblock %}</title>
</head>

<body class="bg-gray-100 text-gray-900">

    <header class="bg-white shadow">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-green-700">
                Kyzyl Suu Trails 🇰🇬
            </h1>
            <nav class="space-x-6">
                <a href="{% url 'core:home' %}" class="text-3xl text-teal-600 rounded-xl hover:text-green-700">
                    Home
                </a>
                <a href="{% url 'core:tour_list' %}" class="text-3xl text-teal-600 hover:text-green-700">
                    Tours
                </a>
                <a href="{% url 'core:about' %}" class="text-3xl text-teal-600 hover:text-green-700">
                    About
                </a>
                <a href="{% url 'core:contact' %}" class="text-3xl text-teal-600 hover:text-green-700">
                    Contact
                </a>
            </nav>
        </div>

        <div class="flex gap-4">
            {% if user.is_authenticated %}
                <span>Hello, {{ user.username }}</span>
            {% else %}
                <a href="{% url 'core:signup' %}" class="text-blue-600">Sign Up</a>
            {% endif %}
        </div>
        
    </header>
    
    <main class="max-w-6xl mx-auto px-6 py-10">
        {% block content %}{% endblock %}
    </main>
    
    <footer class="bg-white border-t">
        <div class="max-w-6xl mx-auto px-6 py-6 text-center text-sm text-gray-500">
            © 2026 Kyzyl Suu Trails · Kyrgyzstan
        </div>
    </footer>
    
</body>
